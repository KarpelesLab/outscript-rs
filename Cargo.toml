[package]
name = "outscript"
version = "0.2.5"
edition = "2024"
rust-version = "1.89"
description = "Generate output scripts, parse/encode addresses, and build/sign transactions across multiple cryptocurrency networks (Bitcoin, EVM, Solana, Massa, ...)."
repository = "https://github.com/KarpelesLab/outscript-rs"
license = "MIT"
keywords = ["bitcoin", "ethereum", "solana", "cryptocurrency", "no_std"]
categories = ["cryptography::cryptocurrencies", "no-std", "no-std::no-alloc"]

[lib]
name = "outscript"

[features]
# `std` is the default and implies `alloc`. Build with `--no-default-features`
# for a `no_std` + no-alloc core (hashing, keys/signing, and slice-based address
# codecs); add `--features alloc` for everything else on `no_std` targets.
#
# Chains are opt-in: each chain feature enables its modules, formats and
# address codecs, and pulls in only the curve arithmetic it needs. The default
# enables every chain.
default = ["std", "bitcoin", "evm", "solana", "cardano", "massa", "zcash", "bcur", "bbqr"]
std = [
    "alloc",
    "purecrypto/std",
    "serde/std",
    "serde_json/std",
    "hex/std",
    "num-bigint/std",
    "num-traits/std",
]
alloc = [
    "dep:serde",
    "dep:serde_json",
    "dep:hex",
    "dep:num-bigint",
    "dep:num-traits",
    "purecrypto/alloc",
]

# --- chains ---
# Bitcoin and Bitcoin-like networks (Litecoin, Dogecoin, Namecoin, Monacoin,
# Dash, Bitcoin Cash, Electraproto): scripts, addresses, `btcraw`/`BtcTx`,
# PSBT, script guessing and block rewards.
bitcoin = ["secp256k1"]
# EVM networks: EIP-55 addresses, `evmraw`/`EvmTx`, ABI helpers.
evm = ["secp256k1"]
# Solana: addresses, program-derived addresses, `SolanaTx`.
solana = ["ed25519"]
# Cardano: Shelley addresses, BIP32-Ed25519 derivation, `CardanoTx`.
cardano = ["ed25519", "purecrypto/kdf"]
# Massa: addresses.
massa = ["ed25519"]
# Zcash: transparent addresses and v5 (ZIP-225/244) transaction signing.
zcash = ["secp256k1"]

# --- transports (chain-independent text encodings for moving PSBTs and other
# payloads between devices, typically as QR codes; only the strings are
# handled here) ---
# Blockchain Commons Uniform Resources (BCR-2020-005): bytewords, single-part
# `ur:` strings and (with `alloc`) multi-part fountain encoding/decoding.
bcur = []
# Coinkite BBQr: headers, hex/base32 parts, zlib (raw deflate) payloads and
# (with `alloc`) splitting and joining.
bbqr = ["dep:minizlib"]

# --- curves (enabled by the chains above; usable on their own for the raw
# `crypto` helpers) ---
secp256k1 = ["purecrypto/hazmat-secp256k1"]
ed25519 = ["purecrypto/hazmat-edwards25519"]

[dependencies]
purecrypto = { version = "0.9", default-features = false, features = ["hash"] }
num-bigint = { version = "0.4", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"], optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
minizlib = { version = "0.1.1", default-features = false, features = ["decompress", "compress", "stored", "fixed", "dynamic"], optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
