name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  no-std:
    name: no_std (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: no-alloc, flags: "--no-default-features --features bitcoin,evm,solana,cardano,massa,zcash,bcur,bbqr" }
          - { name: alloc, flags: "--no-default-features --features alloc,bitcoin,evm,solana,cardano,massa,zcash,bcur,bbqr" }
          # each chain on its own, so none of them leans on another's gates
          - { name: bitcoin, flags: --no-default-features --features alloc,bitcoin }
          - { name: evm, flags: --no-default-features --features alloc,evm }
          - { name: solana, flags: --no-default-features --features alloc,solana }
          - { name: cardano, flags: --no-default-features --features alloc,cardano }
          - { name: massa, flags: --no-default-features --features alloc,massa }
          - { name: zcash, flags: --no-default-features --features alloc,zcash }
          - { name: no-chains, flags: --no-default-features --features alloc }
          # the transports on their own, with and without a heap
          - { name: transports-no-alloc, flags: "--no-default-features --features bcur,bbqr" }
          - { name: transports, flags: "--no-default-features --features alloc,bcur,bbqr" }
          - { name: bcur, flags: "--no-default-features --features alloc,bcur" }
          - { name: bbqr, flags: "--no-default-features --features alloc,bbqr" }
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # a bare-metal target has no `std`, so any std use fails to link
          targets: thumbv7em-none-eabi

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: no-std-${{ matrix.features.name }}

      - name: Build for bare metal
        run: cargo build --target thumbv7em-none-eabi ${{ matrix.features.flags }}

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets ${{ matrix.features.flags }} -- -D warnings

      - name: Test
        run: cargo test ${{ matrix.features.flags }}

      - name: Docs (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
        run: cargo doc --no-deps ${{ matrix.features.flags }}

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Build
        run: cargo build --all-targets

      - name: Build (no_std, no alloc)
        run: cargo build --no-default-features --features bitcoin,evm,solana,cardano,massa,zcash,bcur,bbqr

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps
        run: cargo doc --no-deps
